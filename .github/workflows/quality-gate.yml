name: Quality Gate

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-asset-ledger.cjs check
      - run: node scripts/verify-asset-ledger.cjs report
      - name: Enforce commercial asset evidence on release tags
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        run: node scripts/verify-asset-ledger.cjs check --commercial
      - run: node scripts/qa-release-lifecycle.cjs --mode fixture
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm test:component
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:e2e:built
      - name: Build tagged release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm dist
      - name: Enforce public release readiness
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm verify:release-ready
      - run: node scripts/generate-supply-chain-evidence.cjs --audit-level high
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/projectd-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v7
        with:
          name: projectd-quality-evidence
          path: |
            artifacts/projectd-sbom.cdx.json
            artifacts/security/*.json
            artifacts/coverage/*
            artifacts/asset-ledger-report.json
            artifacts/qa/release-lifecycle-*/report.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
